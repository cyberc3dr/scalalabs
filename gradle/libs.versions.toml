jackson-scala = { module = "tools.jackson.module:jackson-module-scala_3", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

[bundles]
jackson = ["jackson-core", "jackson-databind", "jackson-scala", "jackson-yaml"]

[plugins]
shadow = "com.gradleup.shadow:9.6.1"
